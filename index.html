<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARDM Certificate Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Great+Vibes&family=Mrs+Saint+Delafield&family=Pinyon+Script&family=Alex+Brush&family=Allura&family=Parisienne&family=Dancing+Script:wght@600&family=Herr+Von+Muellerhoff&family=Cinzel:wght@600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#171a24;--mute:#6b6f7c;--line:#dcd8ce;--accent:#b8902f;--red:#d3202a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e15;--panel:#151926;--ink:#eceae3;--mute:#9a9eae;--line:#2a2f42;--accent:#d9b25a}}
:root[data-theme="dark"]{--bg:#0c0e15;--panel:#151926;--ink:#eceae3;--mute:#9a9eae;--line:#2a2f42;--accent:#d9b25a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,sans-serif;line-height:1.5}
.app{max-width:1180px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:22px;grid-template-columns:340px 1fr;align-items:start}
@media(max-width:860px){.app{grid-template-columns:1fr}}
h1{font-family:'Cormorant Garamond',serif;font-size:30px;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px;font-size:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
input,select{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;gap:9px;margin-top:18px}
button{font:inherit;font-weight:500;padding:12px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#14110a}
button.wa{background:#1fa855;border-color:#1fa855;color:#fff}
button:disabled{opacity:.6;cursor:wait}
.note{font-size:12px;color:var(--mute);margin:10px 0 0;min-height:18px}
.stage{overflow:hidden;border-radius:10px;border:1px solid var(--line);background:#000}
.scaler{transform-origin:0 0;width:1000px;height:700px}

/* certificate */
#cert{position:relative;width:1000px;height:700px;color:#e9e4d6;overflow:hidden;font-family:'Jost',sans-serif;
background:radial-gradient(ellipse at 50% 30%,#1b2340 0%,#0b1020 55%,#05070e 100%)}
#cert .b1{position:absolute;inset:18px;border:2px solid #c9a24a}
#cert .b2{position:absolute;inset:30px;border:1px solid rgba(201,162,74,.55)}
#cert .corner{position:absolute;width:56px;height:56px;border:3px solid #c9a24a}
.tl{top:18px;left:18px;border-right:0!important;border-bottom:0!important}
.tr{top:18px;right:18px;border-left:0!important;border-bottom:0!important}
.bl{bottom:18px;left:18px;border-right:0!important;border-top:0!important}
.br{bottom:18px;right:18px;border-left:0!important;border-top:0!important}
#cert .logo{position:absolute;top:48px;left:50%;transform:translateX(-50%);height:112px}
#cert .title{position:absolute;top:172px;width:100%;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:54px;letter-spacing:.22em;color:#d9b866;margin:0;text-indent:.22em}
#cert .kind{position:absolute;top:238px;width:100%;text-align:center;font-size:15px;letter-spacing:.42em;text-indent:.42em;color:#bfc4d6}
#cert .pre{position:absolute;top:290px;width:100%;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;color:#aeb4c8}
#cert .name{position:absolute;top:318px;width:100%;text-align:center;font-family:'Great Vibes',cursive;font-size:76px;line-height:1.15;color:#f3e3b3;padding:0 70px;white-space:nowrap}
#cert .rule{position:absolute;top:416px;left:50%;width:420px;transform:translateX(-50%);height:1px;background:linear-gradient(90deg,transparent,#c9a24a,transparent)}
#cert .body{position:absolute;top:436px;width:100%;text-align:center;font-size:17px;color:#c4c9d9;padding:0 120px}
#cert .course{position:absolute;top:466px;width:100%;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:38px;color:#fff;padding:0 80px}
#cert .extra{position:absolute;top:520px;width:100%;text-align:center;font-size:15px;color:#aeb4c8;padding:0 130px}
#cert .col{position:absolute;bottom:62px;text-align:center;width:230px}
#cert .col .ln{height:1px;background:#c9a24a;margin:0 auto 6px}
#cert .col small{display:block;font-size:12px;letter-spacing:.2em;color:#aeb4c8}
#cert .date{left:90px;font-size:19px}
#cert .sig{right:90px}
#cert .sig .s{font-family:'Mrs Saint Delafield',cursive;font-size:58px;line-height:.9;color:#f3e3b3;height:50px;margin-bottom:2px;white-space:nowrap}
#cert .sig b{display:block;font-weight:500;letter-spacing:.14em;font-size:15px}
#cert .seal{position:absolute;bottom:52px;left:50%;transform:translateX(-50%);width:104px;height:104px;border-radius:50%;
background:radial-gradient(circle at 35% 30%,#f1d98f,#b98a2c 60%,#7d5a14);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(201,162,74,.25)}
#cert .seal i{width:84px;height:84px;border-radius:50%;border:1.5px dashed rgba(40,28,6,.7);display:grid;place-items:center;font-style:normal;text-align:center;font-family:'Cormorant Garamond',serif;font-weight:700;font-size:15px;line-height:1.1;color:#2a1d05}
#cert .cid{position:absolute;bottom:36px;width:100%;text-align:center;font-size:11px;letter-spacing:.25em;color:#6f7590}
</style>
</head>
<body>
<div class="app">
  <section class="panel">
    <h1>Certificate Studio</h1>
    <p class="sub">Type the details, check the preview, then share straight from here.</p>
    <label for="type">Certificate type</label>
    <select id="type">
      <option>Completion</option><option>Achievement</option><option>Participation</option><option>Excellence</option><option>Appreciation</option>
    </select>
    <label for="name">Recipient name</label>
    <input id="name" value="Your Name Here" maxlength="40">
    <label for="namefont">Recipient name font</label>
    <select id="namefont">
      <option value="Great Vibes">Great Vibes (elegant script)</option>
      <option value="Pinyon Script">Pinyon Script (formal)</option>
      <option value="Alex Brush">Alex Brush (brush)</option>
      <option value="Allura">Allura (light script)</option>
      <option value="Parisienne">Parisienne (flowing)</option>
      <option value="Dancing Script">Dancing Script (casual)</option>
      <option value="Cormorant Garamond">Cormorant (classic serif)</option>
      <option value="Cinzel">Cinzel (engraved capitals)</option>
    </select>
    <label for="course">Workshop or course</label>
    <input id="course" value="AI Workshop" maxlength="60">
    <label for="extra">Extra line (optional)</label>
    <input id="extra" value="Held with hands-on practice in modern AI tools" maxlength="90">
    <div class="row">
      <div><label for="date">Date</label><input id="date" type="date"></div>
      <div><label for="id">Certificate ID</label><input id="id" maxlength="20"></div>
    </div>
    <label for="signer">Signed by</label>
    <input id="signer" value="MOHIM DAS" maxlength="30">
    <label for="sigtext">Signature text (handwritten look)</label>
    <input id="sigtext" value="Mohim Das" maxlength="30">
    <label for="sigfont">Signature font</label>
    <select id="sigfont">
      <option value="Mrs Saint Delafield">Mrs Saint Delafield (classic)</option>
      <option value="Herr Von Muellerhoff">Herr Von Muellerhoff (quick pen)</option>
      <option value="Allura">Allura (smooth)</option>
      <option value="Great Vibes">Great Vibes (ornate)</option>
      <option value="Parisienne">Parisienne (flowing)</option>
      <option value="Dancing Script">Dancing Script (casual)</option>
    </select>
    <label for="role">Designation</label>
    <input id="role" value="ARDM" maxlength="30">
    <div class="actions">
      <button class="main" id="share">Share certificate</button>
      <button class="wa" id="wa">Send on WhatsApp</button>
      <button id="copy">Copy image</button>
      <button id="save">Save image (optional)</button>
    </div>
    <p class="note" id="note" role="status"></p>
  </section>
  <section>
    <div class="stage" id="stage"><div class="scaler" id="scaler">
      <div id="cert">
        <div class="b1"></div><div class="b2"></div>
        <div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

        <p class="title">CERTIFICATE</p>
        <div class="kind" id="o-kind"></div>
        <div class="pre">This certificate is proudly presented to</div>
        <div class="name" id="o-name"></div>
        <div class="rule"></div>
        <div class="body">for successfully completing</div>
        <div class="course" id="o-course"></div>
        <div class="extra" id="o-extra"></div>
        <div class="col date"><div id="o-date"></div><div class="ln"></div><small>DATE</small></div>
        <div class="seal"><i>ARDM<br>Verified</i></div>
        <div class="col sig"><div class="s" id="o-sig"></div><div class="ln"></div><b id="o-signer"></b><small id="o-role"></small></div>
        <div class="cid" id="o-id"></div>
      </div>
    </div></div>
  </section>
</div>
<script>
var $=function(i){return document.getElementById(i)};
var f={type:$('type'),name:$('name'),namefont:$('namefont'),sigtext:$('sigtext'),sigfont:$('sigfont'),course:$('course'),extra:$('extra'),date:$('date'),id:$('id'),signer:$('signer'),role:$('role')};
var note=$('note');
function setNote(t){note.textContent=t}
function newId(){return 'ARDM-'+new Date().getFullYear()+'-'+Math.random().toString(36).slice(2,7).toUpperCase()}
f.date.value=new Date().toISOString().slice(0,10);
f.id.value=newId();
function fmt(d){if(!d)return '';var p=d.split('-');var m=['January','February','March','April','May','June','July','August','September','October','November','December'];return parseInt(p[2],10)+' '+m[parseInt(p[1],10)-1]+' '+p[0]}
function fit(el,max,min){el.style.fontSize=max+'px';var s=max;while(el.scrollWidth>el.clientWidth-(el.id==='o-name'?140:0)&&s>min){s-=2;el.style.fontSize=s+'px'}}
function render(){
  $('o-kind').textContent='OF '+f.type.value.toUpperCase();
  $('o-name').textContent=f.name.value||'Recipient name';
  $('o-course').textContent=f.course.value;
  $('o-extra').textContent=f.extra.value;
  $('o-date').textContent=fmt(f.date.value);
  var sg=$('o-sig');sg.textContent=f.sigtext.value;sg.style.fontFamily="'"+f.sigfont.value+"',cursive";sg.style.fontSize='58px';var ss=58;
  while(sg.scrollWidth>sg.clientWidth&&ss>24){ss-=2;sg.style.fontSize=ss+'px'}
  $('o-signer').textContent=f.signer.value.toUpperCase();
  $('o-role').textContent=(f.role.value||'').toUpperCase();
  $('o-id').textContent='CERTIFICATE ID  '+f.id.value;
  var n=$('o-name');n.style.fontFamily="'"+f.namefont.value+"',cursive";n.style.fontSize='76px';var s=76;
  while(n.scrollWidth>860&&s>36){s-=3;n.style.fontSize=s+'px'}
}
Object.keys(f).forEach(function(k){f[k].addEventListener('input',render)});
function scale(){
  var w=$('stage').clientWidth,k=Math.min(1,w/1000);
  $('scaler').style.transform='scale('+k+')';
  $('stage').style.height=(700*k)+'px';
}
window.addEventListener('resize',scale);
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){render();scale()});
render();scale();

function snap(){
  return html2canvas($('cert'),{scale:2,backgroundColor:'#05070e',useCORS:true,windowWidth:1400,
    onclone:function(d){var s=d.getElementById('scaler');s.style.transform='none'}});
}
function blobOf(){return snap().then(function(c){return new Promise(function(r){c.toBlob(r,'image/png')})})}
function fname(){return 'ARDM-Certificate-'+(f.name.value||'recipient').replace(/[^a-z0-9]+/gi,'-')+'.png'}
function busy(on){['share','wa','copy','save'].forEach(function(i){$(i).disabled=on})}
function msg(){return 'Certificate of '+f.type.value+' for '+f.name.value+' – '+f.course.value+' (ARDM)'}

$('share').onclick=function(){
  busy(true);setNote('Preparing your certificate…');
  blobOf().then(function(b){
    var file=new File([b],fname(),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      return navigator.share({files:[file],title:'Certificate',text:msg()}).then(function(){setNote('Shared.')});
    }
    setNote('Sharing files is not supported in this browser. Use “Copy image” or “Send on WhatsApp”.');
  }).catch(function(e){setNote(e&&e.name==='AbortError'?'Sharing cancelled.':'Could not share. Try “Copy image”.')}).finally(function(){busy(false)});
};
$('copy').onclick=function(){
  busy(true);setNote('Preparing image…');
  var p=blobOf().then(function(b){return b});
  if(!(navigator.clipboard&&window.ClipboardItem)){p.then(function(){setNote('Copying images is not supported here. Use “Share certificate”.')}).finally(function(){busy(false)});return}
  p.then(function(b){return navigator.clipboard.write([new ClipboardItem({'image/png':b})])})
   .then(function(){setNote('Image copied. Paste it into any chat.')})
   .catch(function(){setNote('Copy was blocked. Use “Share certificate”.')}).finally(function(){busy(false)});
};
$('wa').onclick=function(){
  busy(true);setNote('Preparing certificate…');
  blobOf().then(function(b){
    var file=new File([b],fname(),{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){return navigator.share({files:[file],text:msg()}).then(function(){setNote('Shared.')})}
    window.open('https://wa.me/?text='+encodeURIComponent(msg()),'_blank');
    setNote('WhatsApp opened with the message. Use “Copy image” and paste the certificate in.');
  }).catch(function(){setNote('Could not open sharing.')}).finally(function(){busy(false)});
};
$('save').onclick=function(){
  busy(true);
  snap().then(function(c){var a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=fname();document.body.appendChild(a);a.click();a.remove();setNote('Saved.')}).finally(function(){busy(false)});
};
</script>
</body>
</html>
